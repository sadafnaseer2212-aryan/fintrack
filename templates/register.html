{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="text-center mb-4">
    <div class="auth-logo"><i class="bi bi-wallet2"></i></div>
    <h3 class="fw-bold">Create your account</h3>
  </div>
  <div class="card p-4">
    <form method="post">
      <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required value="{{ request.form.username }}"></div>
      <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required value="{{ request.form.email }}"></div>
      <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" minlength="6" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Confirm password</label><input name="confirm" type="password" minlength="6" class="form-control" required></div>
      <button class="btn btn-primary w-100">Register</button>
    </form>
    <p class="text-center mt-3 mb-0 small">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
