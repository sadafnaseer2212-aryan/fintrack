{% extends "base.html" %}
{% import "_macros.html" as m with context %}
{% block title %}Edit budget{% endblock %}
{% block page_title %}Edit budget{% endblock %}
{% block page_sub %}<a href="{{ url_for('budgets') }}">Budgets</a> / {{ b.category }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-5">
  <div class="panel"><div class="panel-body p-4">
    <form method="post">
      {{ m.csrf() }}
      <div class="mb-3"><label class="form-label" for="cat">Expense category</label>
        <select id="cat" name="category" class="form-select">{% for c in CATEGORIES.expense %}<option {{ 'selected' if c == b.category }}>{{ c }}</option>{% endfor %}</select></div>
      <div class="mb-3"><label class="form-label" for="amt">Monthly limit (PKR)</label>
        <div class="input-group"><span class="input-group-text">Rs</span><input id="amt" type="number" step="0.01" min="1" name="amount" class="form-control" value="{{ '%.2f'|format(b.amount) }}" required></div></div>
      <div class="mb-4"><label class="form-label">Applies to</label>
        <div class="form-check"><input class="form-check-input" type="radio" name="scope" value="recurring" id="s1" {{ 'checked' if not b.month }} onchange="bm.disabled=true"><label class="form-check-label" for="s1">Every month</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="scope" value="month" id="s2" {{ 'checked' if b.month }} onchange="bm.disabled=false"><label class="form-check-label" for="s2">One month only</label></div>
        <input id="bm" type="month" name="month" value="{{ b.month or today.strftime('%Y-%m') }}" class="form-control mt-1" {{ 'disabled' if not b.month }}></div>
      <div class="d-flex gap-2"><button class="btn btn-primary flex-fill">Save changes</button><a href="{{ url_for('budgets') }}" class="btn btn-light">Cancel</a></div>
    </form>
  </div></div>
</div></div>
{% endblock %}
