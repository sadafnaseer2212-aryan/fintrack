{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="text-center mb-4">
    <div class="auth-logo"><i class="bi bi-wallet2"></i></div>
    <h3 class="fw-bold">FinTrack</h3>
    <p class="text-muted">Personal Finance Tracker with Expense Prediction</p>
  </div>
  <div class="card p-4">
    <h5 class="mb-3">Sign in</h5>
    <form method="post">
      <div class="mb-3"><label class="form-label">Username or email</label><input name="username" class="form-control" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
      <div class="form-check mb-3"><input class="form-check-input" type="checkbox" name="remember" id="remember"><label class="form-check-label" for="remember">Remember me</label></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0 small">No account? <a href="{{ url_for('register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
